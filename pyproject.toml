[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wadachi"
version = "0.1.0"
description = "A neutral record format for coding agent sessions, with reference tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tuomas Taini", email = "tuomas.taini@gmail.com" }]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
zstd = ["zstandard>=0.21"]
test = ["pytest>=7"]

[project.scripts]
wadachi = "wadachi.cli:main"

[project.urls]
Repository = "https://github.com/taituo/wadachi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wadachi.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
